name: CI

# Adapted from Curfew's CI: every check that can run without a deploy.
# Deploys stay with Vercel's Git integration. The e2e job runs the Playwright
# suite against a local Supabase stack.

on:
  push:
    branches: [main]
  pull_request:

# Grouped by commit, so a later push never cancels an earlier commit's run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Decides which parts of the tree this change actually touches, so a PR that
  # only edits docs does not spend minutes re-running the web and
  # e2e suites against code that did not change. The heavy jobs below still run -
  # a required check that reports "skipped" does not satisfy branch protection, so
  # each job stays and reports success while its expensive steps become no-ops.
  #
  # A push to main, or a change to the workflow itself, forces every output true
  # so every job runs: main is the source of truth, and a change to CI
  # must be proven on CI. gitleaks is the only job that never skips, because it
  # reads the whole tree by design.
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's changed files via the GitHub API, which needs
      # this scope; without it the API answers 403 and the filter job fails.
      pull-requests: read
    timeout-minutes: 5
    outputs:
      web: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.web == 'true' }}
      database: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.supabase == 'true' || steps.filter.outputs.web == 'true' }}
      e2e: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.supabase == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request the action lists changed files via the GitHub API
          # (hence pull-requests: read above), which needs no git history. On
          # push it diffs against the previous commit, which a shallow checkout
          # has not fetched - so take the full history for that path.
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'archetypes.json'
            supabase:
              - 'supabase/**'
            deps:
              - 'web/bun.lock'
              - 'web/package.json'
              # The deps checks themselves: editing one must run it, not just
              # typecheck it in the web job.
              - 'web/scripts/check-deps.ts'
              - 'web/scripts/check-actions.ts'
            workflow:
              - '.github/**'

  web:
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - if: needs.filter.outputs.web == 'true'
        uses: ./.github/actions/web-setup

      # `next build` was 42s cold, and most of that is recompiling code that did
      # not change - which is what .next/cache holds. Keyed on the lockfile and
      # every source file so a real change gets a real rebuild; the restore-keys
      # mean an unrelated edit starts from the last good cache, not from nothing.
      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ hashFiles('web/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-
            next-${{ runner.os }}-

      - if: needs.filter.outputs.web == 'true'
        name: Typecheck
        run: bun run typecheck

      # ESLint (Next rules) and oxlint, both at zero warnings.
      - if: needs.filter.outputs.web == 'true'
        name: Lint
        run: bun run lint

      - if: needs.filter.outputs.web == 'true'
        name: Formatted
        run: bun run format:check

      # `check:coverage` IS `vitest run --coverage` plus the floor, so running
      # `test` first ran the whole suite twice - once plain, once instrumented -
      # and gave two answers to "do the tests pass". One run, one answer.
      - if: needs.filter.outputs.web == 'true'
        name: Test, and the rules are still as tested as they were
        run: bun run check:coverage

      # Six text sizes and token colours only; layout one-offs may only fall.
      - if: needs.filter.outputs.web == 'true'
        name: The app is still spending its own tokens
        run: bun run check:tokens

      # Code that is written, exported and never called.
      - if: needs.filter.outputs.web == 'true'
        name: Nothing exported is unreachable
        run: bun run check:dead

      - if: needs.filter.outputs.web == 'true'
        name: Nothing is written out twice
        run: bun run check:dupes

      - if: needs.filter.outputs.web == 'true'
        name: Nothing imports itself in a circle
        run: bun run check:cycles

      # Server queries bypass row-level security, so each one on a user-owned table
      # has to name its owner. Cross-user queries are allowlisted with a reason.
      - if: needs.filter.outputs.web == 'true'
        name: Every query on a user's rows is scoped to its owner
        run: bun run check:user-scope

      # The browser suites are split across shards that name the specs they run,
      # and a spec no shard names would never run, greenly. This is the only
      # thing that would notice.
      - if: needs.filter.outputs.web == 'true'
        name: Every browser spec is run by some shard
        run: bun run check:shards

      # The archetype registry is a single JSON the app reads through a generated module;
      # the app's typed module must not drift from it. Skips while the registry is empty.
      - if: needs.filter.outputs.web == 'true'
        name: The generated archetype module matches archetypes.json
        run: bun run check:archetypes

      # The build never connects to anything, so dummy values are enough.
      # Never put real secrets here.
      - if: needs.filter.outputs.web == 'true'
        name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Reads .next, so it has to follow the build.
      - if: needs.filter.outputs.web == 'true'
        name: The app still fits on a phone
        run: bun run check:bundle

  # Migrations from empty, then the row-level security and tracker checks,
  # against a throwaway local Supabase (Postgres + auth) instead of the real one.
  database:
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-google-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-google-secret
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7

      # Backgrounded, so the stack comes up while the dependencies install rather
      # than after them. `supabase-ready` below is the wait.
      - if: needs.filter.outputs.database == 'true'
        uses: ./.github/actions/supabase-stack

      - if: needs.filter.outputs.database == 'true'
        uses: ./.github/actions/web-setup

      - if: needs.filter.outputs.database == 'true'
        uses: ./.github/actions/supabase-ready

      - if: needs.filter.outputs.database == 'true'
        name: Migrating again changes nothing
        run: supabase db reset

      - if: needs.filter.outputs.database == 'true'
        name: Row-level security
        working-directory: web
        run: bun run scripts/check-rls.ts

      - if: needs.filter.outputs.database == 'true'
        name: Deletes keep learning history, audit columns let go, bad values are refused
        working-directory: web
        run: bun run scripts/check-db-guards.ts

      - if: needs.filter.outputs.database == 'true'
        name: The tracker plans, ticks and revives correctly
        working-directory: web
        run: bun --conditions=react-server scripts/check-tracker.ts

      - if: needs.filter.outputs.database == 'true'
        name: The share code lookup shows only an approved owner's own days
        working-directory: web
        run: bun --conditions=react-server scripts/check-share.ts

      - if: needs.filter.outputs.database == 'true'
        name: Saving push devices keeps at most 10 per user and only real push services
        working-directory: web
        run: bun --conditions=react-server scripts/check-push.ts

      - if: needs.filter.outputs.database == 'true'
        name: Every Analytics query runs against the schema
        working-directory: web
        run: bun --conditions=react-server scripts/check-analytics.ts

      - if: needs.filter.outputs.database == 'true'
        name: Scheduled job runs are recorded, pruned and read back
        working-directory: web
        run: bun --conditions=react-server scripts/check-jobs.ts

      - if: needs.filter.outputs.database == 'true'
        name: Feed flags and stale cards
        working-directory: web
        run: bun --conditions=react-server scripts/check-feed.ts

      - if: needs.filter.outputs.database == 'true'
        name: Friends and invites
        working-directory: web
        run: bun --conditions=react-server scripts/check-friends.ts

      # The Coach's read tools. Was never wired into CI; the friends change
      # assumed everyone-sees-everyone in get_friend_summary, so this guards the
      # fix.
      - if: needs.filter.outputs.database == 'true'
        name: The Coach sees only its user's rows
        working-directory: web
        run: bun --conditions=react-server scripts/check-coach-tools.ts

      # Break our own app: the direct round attacks the service layer as the
      # wrong identity, against the throwaway Supabase it just built. The HTTP
      # half runs in the e2e job, where a real server is up.
      - if: needs.filter.outputs.database == 'true'
        name: Break in (direct)
        working-directory: web
        run: bun --conditions=react-server scripts/break-in/run.ts

  # Playwright smoke tests against a production build on a throwaway
  # local Supabase. Sign-in goes through /api/test/sign-in, which only answers
  # with E2E=1, off Vercel, and against this local Supabase.
  # Sharded, because this job was the whole run's wall clock: 247s against
  # 121s for the next slowest, so every other job sat finished waiting for it.
  #
  # Split by MEASURED weight, not by guess. Playwright's own `--shard` partitions
  # by spec file and balances on test COUNT, which gave 22 tests against 10 and a
  # long pole barely shorter than the whole suite. The real numbers, read off a
  # green run's log and summed per file over both projects: feed 24.3s, coach
  # 18.6s, a11y 10.2s, finish-day 6.1s, offline 5.4s, and the remaining four 6.4s
  # together, out of 71s. So the two groups below were 34.5s and 36.6s; friends,
  # added later, rides with the first and was not measured.
  #
  # Splitting is legal because a shard is its own database, its own server and its
  # own seed, and because `signIn` in e2e/helpers.ts makes a new user per call -
  # "tests, projects and retries never share a day's state". No spec depends on
  # another having run.
  #
  # `workers` stays 1 inside a shard. The specs are data-independent, but they
  # share one fake-model server and coach.spec.ts reads its request log. It
  # matches on its own message text so it would probably survive, and "probably"
  # is not the standard for the job that gates every merge.
  #
  # A spec no shard names would never run, and CI would be green and faster for
  # it. `check:shards` in the web job is what refuses that.
  #
  # fail-fast is off: one shard failing tells you about that shard, and cancelling
  # the other to save a minute throws away what you would look at next.
  e2e-shard:
    name: e2e ${{ matrix.id }}
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # A name is a substring filter on the spec's path, so a name must not be a
          # substring of another spec: "coach" would also claim coach-lessons.spec.ts,
          # and check:shards refuses a spec two shards both run. The reorg names
          # below are chosen to avoid every existing one.
          #
          # They are registered before the specs exist so that no branch in the reorg has
          # to edit this file - several branches editing these two lists is a merge
          # argument, and a spec a branch forgot to register would silently never run.
          # Playwright ignores a filter that matches nothing as long as something else
          # matches; check:shards knows which names are still pending.
          - id: feed
            specs: >-
              feed
              a11y
              friends
              me-reorg
              lessons
              library
              mock-picker
              tapspot
              ordering
              pairing
              bucketing
              assembling
              claimgrid
              keypad
              gridtoggle
              whystep
              composing
              dragging
              maintenance
          - id: coach
            specs: >-
              coach
              audio
              instant
              stream-sections
              finish-day
              share.spec
              more
              offline
              checkin
              admin
              analytics-dashboard
              jobs-section
              today
              timezone
              first-run
              demo-tips
              brand
              sign-in-gate
              landing
              try-listen
              weekly-read
              banners
              chat-state
              problem-page
              plan-setup
              xp.spec
              optimistic-actions
              uptime-health
              trust-pages
              pwa-install
    defaults:
      run:
        working-directory: web
    services:
      redis:
        image: redis:7
      redis-http:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-redis-token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-google-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-google-secret
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      # The coach talks to web/e2e/fake-model.ts, which streams fixed replies,
      # so the suite never reaches a real model. Not a secret.
      AI_PROVIDER: openai-compatible
      AI_API_KEY: ci-fake-model-key
      AI_BASE_URL: http://localhost:8078/v1
      AI_MODEL_FAST: fake-fast
      AI_MODEL_SMART: fake-smart
      E2E: "1"
      # Audio lessons: the listen bar shows when the four read-only R2 variables are set, and the player plays
      # web/public/e2e/tone.mp3 instead of a signed URL (NEXT_PUBLIC_*, so inlined at build). Not secrets.
      NEXT_PUBLIC_E2E_AUDIO_SRC: /e2e/tone.mp3
      AUDIO_R2_ACCOUNT_ID: e2e
      AUDIO_R2_READ_ACCESS_KEY_ID: e2e
      AUDIO_R2_READ_SECRET_ACCESS_KEY: e2e
      AUDIO_R2_BUCKET: e2e
      # The test sign-in route's explicit opt-in (see test-sign-in.ts); the e2e
      # job is the only place it is ever set.
      ALLOW_TEST_SIGN_IN: "1"
    steps:
      - uses: actions/checkout@v7

      # Backgrounded: the stack pulls and migrates while the dependencies and
      # Chromium install, instead of after them. `supabase-ready` below is the wait.
      - if: needs.filter.outputs.e2e == 'true'
        uses: ./.github/actions/supabase-stack

      - if: needs.filter.outputs.e2e == 'true'
        uses: ./.github/actions/web-setup
        with:
          playwright: "true"

      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ hashFiles('web/src/**') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-
            next-e2e-${{ runner.os }}-

      - if: needs.filter.outputs.e2e == 'true'
        uses: ./.github/actions/supabase-ready

      # The local stack's well-known demo keys, not secrets. The build cannot move
      # above the wait: Next inlines NEXT_PUBLIC_* at build time and these are
      # where they come from. The API port is fixed at 54321 so the URL could be
      # hardcoded, but the publishable key is not guaranteed stable across CLI
      # versions - hence the fallback below - and guessing it wrong breaks sign-in
      # in the browser rather than failing here.
      - if: needs.filter.outputs.e2e == 'true'
        name: Point the app at local Supabase
        working-directory: .
        run: |
          eval "$(cat /tmp/supabase.env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - if: needs.filter.outputs.e2e == 'true'
        name: Seed the e2e dataset
        run: bun run scripts/seed-e2e.ts

      - if: needs.filter.outputs.e2e == 'true'
        name: Build
        run: bun run build

      - if: needs.filter.outputs.e2e == 'true'
        name: Start the fake model
        run: |
          nohup bun run e2e/fake-model.ts > fake-model.log 2>&1 &
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:8078/requests; do sleep 1; done'

      - if: needs.filter.outputs.e2e == 'true'
        name: Start the app
        run: |
          nohup bun run start > next.log 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000/; do sleep 1; done'

      - if: needs.filter.outputs.e2e == 'true'
        name: Smoke tests
        run: bunx playwright test ${{ matrix.specs }}

      # The break-in suite: the direct round (against the throwaway Supabase and
      # the Redis this job brings up, so the rate-limit flood actually runs) plus
      # the HTTP sweep of the running server.
      - if: needs.filter.outputs.e2e == 'true'
        name: Break in
        run: bun --conditions=react-server scripts/break-in/run.ts --http=http://localhost:3000

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            web/playwright-report/
            web/test-results/
            web/next.log
            web/fake-model.log
          retention-days: 7

  # One check named `e2e`, whatever the shards are called.
  #
  # `main`'s branch protection requires a check named `e2e`. Sharding renamed the
  # real ones to "e2e feed" and "e2e coach", so nothing reported `e2e` any more
  # and the PR sat on "Expected - Waiting for status to be reported" forever,
  # unmergeable. Naming both shards in branch protection would fix it once and
  # break again the next time the matrix changes; this cannot.
  #
  # `if: always()` so it runs even when a shard fails, and the result is compared
  # explicitly because a skipped or cancelled dependency is not a pass.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ] || exit 1

  # Reads the live registries, so it can go red on a day nothing changed.
  # That is the check working; it is its own job so it never looks like the code failing.
  deps:
    runs-on: ubuntu-latest
    needs: filter
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - if: needs.filter.outputs.deps == 'true'
        uses: ./.github/actions/web-setup

      - if: needs.filter.outputs.deps == 'true'
        name: No known advisories
        run: bun run check:audit

      - if: needs.filter.outputs.deps == 'true'
        name: Nothing we chose is deprecated
        run: bun run check:deps

      - if: needs.filter.outputs.deps == 'true'
        name: No pinned action is behind
        run: bun run check:actions
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Secret scanning. Reads the whole tree, so it goes red the moment a real key
  # is committed, whatever else is green. The allow-list in .gitleaks.toml is
  # the deliberate non-secrets.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
