name: DB backup

# Nightly encrypted pg_dump of the production database. Schedule and manual
# dispatch only: never on pull requests or forks, so secrets are never exposed
# to PR code. See BACKUPS.md for secrets, restore and the drill.
#
# This repo is PUBLIC, so the dump is never a workflow artifact (anyone signed in
# to GitHub can download those). It is GPG-encrypted on the runner and uploaded to
# a PRIVATE Cloudflare R2 bucket; the plaintext never leaves the runner.
#
# A failed scheduled run emails the repo owner by default (GitHub notifies the
# person who last edited the cron line in this file).

on:
  schedule:
    # 21:30 UTC = 03:00 IST.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # For the job_runs row the last step writes: when this run started.
      - name: Note the start time
        run: echo "RUN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      # Supabase runs Postgres 17 (supabase/config.toml major_version). pg_dump
      # must be the same major or newer than the server, so take 17 from PGDG.
      - name: Install Postgres 17 client
        id: install
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        id: dump
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PROD_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::PROD_DB_URL and BACKUP_PASSPHRASE secrets must both be set (see BACKUPS.md)"
            exit 1
          fi
          echo "::add-mask::$PROD_DB_URL"
          echo "::add-mask::$BACKUP_PASSPHRASE"

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="${RUNNER_TEMP}/backup"
          mkdir -p "$out"
          # The app uses `public` (all its tables) and `auth` (users and
          # identities). It stores no files in Supabase Storage.
          # -Fc: custom format, so pg_restore can pick tables and run in parallel.
          # Output goes to a file: pg_dump errors stay visible but the URL never prints.
          /usr/lib/postgresql/17/bin/pg_dump "$PROD_DB_URL" \
            -Fc --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file="$out/90x-$stamp.dump"

          # The archive must be non-trivial and list its TOC before we trust it.
          test "$(stat -c %s "$out/90x-$stamp.dump")" -gt 10000
          /usr/lib/postgresql/17/bin/pg_restore --list "$out/90x-$stamp.dump" >/dev/null

          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$out/90x-$stamp.dump.gpg" "$out/90x-$stamp.dump"

          # Plaintext never gets uploaded; remove it now.
          shred -u "$out/90x-$stamp.dump" 2>/dev/null || rm -f "$out/90x-$stamp.dump"
          ls -l "$out"
          echo "ARTIFACT_NAME=90x-db-$stamp" >> "$GITHUB_ENV"
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"

      # Private bucket, written with an R2 token scoped to it. The bucket's lifecycle rule deletes
      # objects after 30 days (set in the Cloudflare dashboard, see BACKUPS.md).
      - name: Upload to the private R2 bucket
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT and R2_BUCKET secrets must all be set (see BACKUPS.md)"
            exit 1
          fi
          echo "::add-mask::$R2_ENDPOINT"
          echo "::add-mask::$R2_BUCKET"
          file="$(ls "$OUT_DIR"/*.gpg)"
          # The db-backups bucket holds backups for several apps; ours sit under 90x/.
          key="90x/$(basename "$file")"
          aws s3 cp "$file" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # Read it back: the object must exist with the same size before the run counts as a backup.
          remote=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)
          test "$remote" = "$(stat -c %s "$file")"
          echo "uploaded $(basename "$file") ($remote bytes)"
          echo "BACKUP_BYTES=$remote" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=$key" >> "$GITHUB_ENV"
          shred -u "$file" 2>/dev/null || rm -f "$file"

      # One row in job_runs for the Scheduled jobs section of admin Analytics: status, duration and the
      # uploaded size. It runs whatever happened above and never fails the backup: a row that could not be
      # written shows on that page as a late backup. psql's own errors are not printed, because they can
      # name the database host and user.
      - name: Record the run for admin Analytics
        if: always()
        continue-on-error: true
        # A step timeout is covered by continue-on-error; a hung psql reaching the job's 20 minutes is not,
        # and would turn an uploaded backup into a failed run.
        timeout-minutes: 2
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PGCONNECT_TIMEOUT: "15"
          # The job's status so far; this is the last step, so it covers every step above.
          JOB_STATUS: ${{ job.status }}
          FAILED_STEP: ${{ steps.install.outcome == 'failure' && 'Install Postgres 17 client' || steps.dump.outcome == 'failure' && 'Dump and encrypt' || steps.upload.outcome == 'failure' && 'Upload to the private R2 bucket' || '' }}
        run: |
          set -uo pipefail
          if [ -z "${PROD_DB_URL:-}" ]; then
            echo "::warning::PROD_DB_URL is not set, so this run is not recorded"
            exit 0
          fi
          echo "::add-mask::$PROD_DB_URL"
          psql_bin=/usr/lib/postgresql/17/bin/psql
          [ -x "$psql_bin" ] || psql_bin=psql
          status=failed
          error="step \"${FAILED_STEP:-unknown}\" failed (job ${JOB_STATUS})"
          if [ "$JOB_STATUS" = "success" ]; then status=ok; error=""; fi
          started="${RUN_STARTED:-$(date -u +%s)}"
          if "$psql_bin" "$PROD_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -v status="$status" -v error="$error" -v started="$started" \
            -v bytes="${BACKUP_BYTES:-0}" -v key="${BACKUP_KEY:-}" >/dev/null 2>&1 <<'SQL'
          -- Set here, not via PGOPTIONS: the Supabase pooler may not pass startup options through.
          set statement_timeout = '15s';
          insert into public.job_runs (job, started_at, finished_at, status, duration_ms, result, error)
          values (
            'db-backup',
            to_timestamp(:'started'::bigint),
            now(),
            :'status',
            greatest(0, round(extract(epoch from now()) * 1000) - :'started'::bigint * 1000)::int,
            case when :'key' = '' then '{}'::jsonb else jsonb_build_object('bytes', :'bytes'::bigint, 'key', :'key') end,
            nullif(:'error', '')
          );
          SQL
          then
            echo "recorded db-backup: $status"
          else
            echo "::warning::could not record this run in job_runs (psql exit $?)"
            exit 1
          fi
